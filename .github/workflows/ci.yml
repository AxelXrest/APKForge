name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_PLATFORMTHEME: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -e . build twine
      - name: Require GUI imports before testing
        run: python -c "from PySide6.QtWidgets import QApplication; from apkforge.app import Window"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q apkforge
      - run: bash -n run.sh
      - run: python -m build && python -m twine check dist/*
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m venv /tmp/apkforge-wheel
          /tmp/apkforge-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/apkforge-wheel/bin/python -c "from apkforge.app import main; from importlib.resources import files; assert files('apkforge').joinpath('translations.json').is_file()"
